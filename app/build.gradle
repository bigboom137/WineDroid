plugins {
    id 'com.android.application'
}

android {
    namespace 'com.winedroid'
    compileSdk 34

    defaultConfig {
        applicationId 'com.winedroid'
        minSdk 28
        // Wine forks wineserver and the wine loader from the app's data
        // directory. Android only allows exec() of app data files for apps
        // targeting API 28 or lower, so this must stay at 28.
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 2
        versionName '11.0-2'
        ndk { abiFilters 'x86_64' }
    }

    // The Wine install trees (one per runtime) are copied out of the APK on
    // first launch, so they are only read once as a stream. Keep them
    // compressed: stored uncompressed, two runtimes make a ~2 GB APK.
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-options'
}
